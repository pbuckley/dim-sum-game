<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick a game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f5f4f0; color: #1a1a18; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
.title { font-size: 28px; font-weight: 500; margin-bottom: 2rem; color: #5f5e5a; }
.carousel { display: flex; align-items: center; gap: 1rem; }
.arrow { background: none; border: none; font-size: 36px; color: #98968e; cursor: pointer; padding: 0.5rem 0.75rem; border-radius: 8px; font-family: inherit; transition: color 0.15s, background 0.15s, transform 0.1s; }
.arrow:hover { color: #1a1a18; background: rgba(0,0,0,0.04); }
.arrow:active { transform: scale(0.92); }
.game-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.15); border-radius: 20px; padding: 2.5rem 3.5rem; cursor: pointer; text-align: center; min-width: 260px; transition: transform 0.15s, box-shadow 0.15s; }
.game-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.game-card:active { transform: translateY(0); }
.game-emoji { font-size: 96px; line-height: 1; margin-bottom: 1rem; }
.game-name { font-size: 24px; font-weight: 500; margin-bottom: 4px; }
.game-tagline { font-size: 14px; color: #5f5e5a; }
.dots { display: flex; gap: 8px; margin-top: 1.5rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #d4d3ce; transition: background 0.15s; cursor: pointer; }
.dot.active { background: #1D9E75; }
.hint { font-size: 12px; color: #98968e; margin-top: 1.5rem; }
@media (prefers-reduced-motion: no-preference) {
  .game-card.swap { animation: swap 0.18s ease-out; }
}
@keyframes swap {
  0% { opacity: 0; transform: translateY(4px); }
  100% { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
  <div class="title">Pick a game</div>
  <div class="carousel">
    <button class="arrow" id="prev" aria-label="Previous">‹</button>
    <div class="game-card" id="card" role="button" tabindex="0">
      <div class="game-emoji" id="emoji"></div>
      <div class="game-name" id="name"></div>
      <div class="game-tagline" id="tagline"></div>
    </div>
    <button class="arrow" id="next" aria-label="Next">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="hint">← → to switch &middot; Enter or click to play</div>

<script>
const GAMES = [
  { emoji: "🥟", name: "Dim Sum", tagline: "Bible math trivia", href: "dimsum.html" },
  { emoji: "🍫", name: "Hershey", tagline: "Milton Hershey trivia", href: "hershey.html" }
];
let idx = 0;
const card = document.getElementById("card");
const emojiEl = document.getElementById("emoji");
const nameEl = document.getElementById("name");
const taglineEl = document.getElementById("tagline");
const dotsEl = document.getElementById("dots");

function render() {
  const g = GAMES[idx];
  emojiEl.textContent = g.emoji;
  nameEl.textContent = g.name;
  taglineEl.textContent = g.tagline;
  dotsEl.innerHTML = GAMES.map((_, i) =>
    `<div class="dot${i === idx ? ' active' : ''}" data-i="${i}"></div>`
  ).join("");
  dotsEl.querySelectorAll(".dot").forEach(d => {
    d.onclick = () => { idx = parseInt(d.dataset.i); animate(); render(); };
  });
}

function animate() {
  card.classList.remove("swap");
  void card.offsetWidth;
  card.classList.add("swap");
}

function cycle(delta) {
  idx = (idx + delta + GAMES.length) % GAMES.length;
  animate();
  render();
}

function play() {
  window.location.href = GAMES[idx].href;
}

document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
card.onclick = play;
card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(); } };

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { e.preventDefault(); cycle(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); cycle(1); }
  else if (e.key === "Enter") { e.preventDefault(); play(); }
});

render();
</script>
</body>
</html>
